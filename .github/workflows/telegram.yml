name: Отправка новых карточек в Telegram

on:
  push:
    paths:
      - 'cards/*.json'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Проверяем секреты
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ Секреты не заданы!"
            exit 1
          fi

          # Находим изменённые JSON-файлы
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'cards/*.json' | grep -v 'manifest.json' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "📭 Новых карточек нет."
            exit 0
          fi

          # Отправляем каждую карточку
          for FILE in $CHANGED_FILES; do
            echo "📄 Обрабатываем: $FILE"

            # Безопасное чтение полей (если поля нет — ставим "Не указано")
            NAME=$(jq -r '.name // "Не указано"' "$FILE" 2>/dev/null || echo "Не указано")
            PHONE=$(jq -r '.phone // "Не указан"' "$FILE" 2>/dev/null || echo "Не указан")
            ADDRESS=$(jq -r '.address // "Не указан"' "$FILE" 2>/dev/null || echo "Не указан")
            SOCIALS=$(jq -r '.socials | to_entries | map("\(.key): \(.value)") | join(", ")' "$FILE" 2>/dev/null || echo "Нет данных")

            # Формируем сообщение
            MESSAGE="🆕 *Новая карточка в Деанон!*%0A%0A"
            MESSAGE+="👤 *$NAME*%0A"
            MESSAGE+="📱 $PHONE%0A"
            MESSAGE+="📍 $ADDRESS%0A"
            MESSAGE+="🔗 $SOCIALS%0A%0A"
            MESSAGE+="🔗 Сайт: https://db.deanon.rf.gd/"

            echo "📨 Отправляем: $NAME"

            # Отправляем в Telegram
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MESSAGE" \
              -d "parse_mode=Markdown")

            # Проверяем ответ
            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✅ Отправлено: $NAME"
            else
              echo "❌ Ошибка отправки: $RESPONSE"
              exit 1
            fi
          done

          echo "✅ Все карточки отправлены!"