<body>
    <!-- Custom Cursor -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- Header -->
    <header class="glass header">
        <a href="/" class="logo" aria-label="De-Anon" data-text="Деанон"></a>
        <nav class="nav">
            <a href="/about/" data-i18n="about">О проекте</a>
            <a href="/faq/" data-i18n="faq">FAQ</a>
            <a href="/tos/" data-i18n="tos">Условия</a>
            <a href="/privacy/" data-i18n="privacy">Приватность</a>
        </nav>

        <div class="controls">
            <!-- BVI Button -->
            <button class="btn-icon" id="bviBtn" aria-label="Accessibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
            </button>

            <!-- Theme Dropdown -->
            <div class="dropdown" id="themeDropdown">
                <button class="btn-icon dropdown-toggle" id="themeToggleBtn" aria-label="Theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <div class="dropdown-menu glass">
                    <button class="dropdown-item" data-theme="system">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M2 3 A 1 1 0 0 0 1 4 L 1 24 A 1 1 0 0 0 2 25 L 15 25 L 15 27 L 12 27 A 1 1 0 0 0 12 29 L 20 29 A 1 1 0 1 0 20 27 L 17 27 L 17 25 L 30 25 A 1 1 0 0 0 31 24 L 31 4 A 1 1 0 0 0 30 3 L 2 3 z M 3 5 L 29 5 L 29 23 L 3 23 L 3 5 z" transform="scale(0.8)"/></svg>
                        <span data-i18n="theme_system">Системная</span>
                    </button>
                    <button class="dropdown-item" data-theme="light">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 3V4M12 20V21M4 12H3M6.3 6.3L5.5 5.5M17.7 6.3L18.5 5.5M6.3 17.7L5.5 18.5M17.7 17.7L18.5 18.5M21 12H20M16 12C16 14.2 14.2 16 12 16C9.8 16 8 14.2 8 12C8 9.8 9.8 8 12 8C14.2 8 16 9.8 16 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span data-i18n="theme_light">Светлая</span>
                    </button>
                    <button class="dropdown-item" data-theme="dark">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32"><path d="M10.9 7.6c0 7.5 5.2 13.7 11.6 13.7 1.6 0 3.1-0.4 4.5-1.1-1.7 4.5-6 7.6-11.1 7.6-6.5 0-11.8-5.3-11.8-11.8 0-4.8 2.9-9 7-10.8-0.1 0.8-0.2 1.6-0.2 2.4z"/></svg>
                        <span data-i18n="theme_dark">Тёмная</span>
                    </button>
                </div>
            </div>

            <!-- Language Dropdown -->
            <div class="dropdown" id="langDropdown">
                <button class="btn-icon dropdown-toggle" id="langToggleBtn" aria-label="Language">
                    <svg viewBox="0 0 640 480" style="width:20px;height:15px;"><path fill="#fff" d="M0 0h640v160H0z"/><path fill="#0039a6" d="M0 160h640v160H0z"/><path fill="#d52b1e" d="M0 320h640v160H0z"/></svg>
                </button>
                <div class="dropdown-menu glass">
                    <button class="dropdown-item" data-lang="ru">

                    </button>
                    <button class="dropdown-item" data-lang="en">
                        <svg viewBox="0 0 640 480" style="width:20px;height:15px;"><path fill="#bd3d44" d="M0 0h640v480H0"/><path stroke="#fff" stroke-width="37" d="M0 55.3h640M0 129h640M0 203h640M0 277h640M0 351h640M0 425h640"/><path fill="#192f5d" d="M0 0h364.8v258.5H0"/></svg>

                    </button>

                        <span>FR</span>

                </div>

            <!-- Layout Toggle -->
            <button class="btn-icon" id="layoutToggle" aria-label="Toggle Layout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>

    <!-- Main Content -->
    <main class="main-content">
        <div class="controls-panel glass">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по имени, телефону, нику..." data-i18n="search_placeholder">
            <div class="filters">
                <button class="filter-btn active" data-filter="all" data-i18n="filter_all">Все</button>
                <button class="filter-btn" data-filter="telegram" data-i18n="filter_telegram">Telegram</button>
                <button class="filter-btn" data-filter="vk" data-i18n="filter_vk">ВКонтакте</button>
                <button class="filter-btn" data-filter="discord" data-i18n="filter_discord">Discord</button>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- BVI Panel -->
    <div class="bvi-panel glass" id="bviPanel">
        <button class="bvi-close" id="bviClose">&times;</button>
        <div class="bvi-group">
            <label data-i18n="bvi_font_size">Размер шрифта</label>
            <input type="range" id="bviFontSize" min="14" max="24" value="16">
        </div>
        <div class="bvi-group">
            <label data-i18n="bvi_ui_size">Размер интерфейса</label>
            <input type="range" id="bviUiSize" min="100" max="150" value="100">
        </div>
        <div class="bvi-group">
            <label data-i18n="bvi_serif">Засечки</label>
            <label class="switch">
                <input type="checkbox" id="bviSerif">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content glass" id="modalContent"></div>
    </div>

    <footer class="footer glass"><p data-i18n="footer_text">© 2024 Деанон. Все права защищены.</p></footer>
