<body>
    <div id="app" class="force-desktop">
        <header class="header glass">
            <a href="/" class="logo" aria-label="Главная">
                <img src="/assets/logo.webp" alt="Деанон" width="48" height="48" class="logo-img">
                <span class="logo-text" data-i18n="site_title">Деанон</span>
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <a href="/about/" data-i18n="about">О проекте</a>
                <a href="/faq/" data-i18n="faq">FAQ</a>
                <a href="/tos/" data-i18n="tos">Условия</a>
                <a href="/privacy/" data-i18n="privacy">Приватность</a>
            </nav>
            <div class="header-controls">
                <!-- Language Dropdown -->
                <div class="lang-dropdown">
                    <button class="icon-btn lang-btn" aria-label="Выбор языка" title="Язык">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    </button>
                    <div class="lang-options glass">
                        <button class="lang-option" data-lang="ru">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="20" height="15"><path fill="#fff" d="M0 0h640v160H0z"/><path fill="#0039a6" d="M0 160h640v160H0z"/><path fill="#d52b1e" d="M0 320h640v160H0z"/></svg> RU
                        </button>
                        <button class="lang-option" data-lang="en">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="20" height="15"><path fill="#bd3d44" d="M0 0h640v480H0"/><path stroke="#fff" stroke-width="37" d="M0 55.3h640M0 129h640M0 203h640M0 277h640M0 351h640M0 425h640"/><path fill="#192f5d" d="M0 0h364.8v258.5H0"/><marker id="us-a" markerHeight="30" markerWidth="30"><path fill="#fff" d="m14 0 9 27L0 10h28L5 27z"/></marker><path fill="none" marker-mid="url(#us-a)" d="m0 0 16 11h61 61 61 61 60L47 37h61 61 60 61L16 63h61 61 61 61 60L47 89h61 61 60 61L16 115h61 61 61 61 60L47 141h61 61 60 61L16 166h61 61 61 61 60L47 192h61 61 60 61L16 218h61 61 61 61 60z"/></svg> EN
                        </button>
                        <button class="lang-option" data-lang="fr">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="20" height="15"><path fill="#000091" d="M0 0h213.3v480H0z"/><path fill="#fff" d="M213.3 0h213.4v480H213.3z"/><path fill="#e1000f" d="M426.7 0H640v480H426.7z"/></svg> FR
                        </button>
                    </div>
                </div>
                <!-- Theme toggle -->
                <div class="theme-switcher">
                    <button class="icon-btn theme-btn system" data-theme="system" title="Системная тема">
                        <svg width="24" height="24" viewBox="0 0 8.4666669 8.4666669"><g transform="translate(0,-288.53332)"><path transform="matrix(0.26458333,0,0,0.26458333,0,288.53332)" d="M2 3 A1 1 0 001 4 L1 24 A1 1 0 002 25 L15 25 L15 27.001953 L12.003906 27.001953 A1 1 0 0011.900391 27.001953 A1.0015858 1.0015858 0 0012.003906 29.003906 L19.998047 29.003906 A1.000252 1.000252 0 1019.998047 27.001953 L17 27.001953 L17 25 L30 25 A1 1 0 0031 24 L31 4 A1 1 0 0030 3 L2 3 z M3 5 L29 5 L29 23 L3 23 L3 5 z"/><path d="m4.497917,294.08957 a0.26458332,0.26458332 0 010.2645833,0.26458 0.26458332,0.26458332 0 01-0.2645833,0.26458 0.26458332,0.26458332 0 01-0.2645833,-0.26458 0.26458332,0.26458332 0 010.2645833,-0.26459z"/></g></svg>
                    </button>
                    <button class="icon-btn theme-btn light" data-theme="light" title="Светлая тема">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3V4M12 20V21M4 12H3M6.31412 6.31412L5.5 5.5M17.6859 6.31412L18.5 5.5M6.31412 17.69L5.5 18.5001M17.6859 17.69L18.5 18.5001M21 12H20M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z"/></svg>
                    </button>
                    <button class="icon-btn theme-btn dark" data-theme="dark" title="Тёмная тема">
                        <svg width="24" height="24" viewBox="0 0 32 32"><path d="M10.895 7.574c0 7.55 5.179 13.67 11.567 13.67 1.588 0 3.101-0.38 4.479-1.063-1.695 4.46-5.996 7.636-11.051 7.636-6.533 0-11.83-5.297-11.83-11.83 0-4.82 2.888-8.959 7.023-10.803-0.116 0.778-0.188 1.573-0.188 2.39z"/></svg>
                    </button>
                </div>
                <!-- BVI accessibility button -->
                <button class="icon-btn bvi-toggle" data-i18n-title="accessibility" title="Панель доступности">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                </button>
                <!-- Version toggle (mobile/desktop) -->
                <button class="icon-btn version-toggle" data-i18n-title="version_toggle" title="Переключить версию">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <section class="search-section glass">
                <input type="text" id="search-input" class="search-input" placeholder="Поиск..." data-i18n-placeholder="search_placeholder">
                <div class="filter-group">
                    <select id="filter-select" class="filter-select">
                        <option value="all" data-i18n="filter_all">Все</option>
                        <option value="name" data-i18n="filter_name">Имя</option>
                        <option value="phone" data-i18n="filter_phone">Телефон</option>
                        <option value="address" data-i18n="filter_address">Адрес</option>
                    </select>
                </div>
            </section>

            <div id="cards-container" class="cards-grid">
                <!-- Карточки генерируются JS -->
            </div>
            <div id="no-results" class="no-results" hidden data-i18n="no_results">Ничего не найдено</div>
        </main>

        <footer class="footer glass">
            <p data-i18n="footer_text">© 2024 Деанон. Все права защищены.</p>
        </footer>
    </div>

    <!-- Модальное окно карточки -->
    <div id="card-modal" class="modal glass" hidden>
        <div class="modal-content glass">
            <button class="modal-close" aria-label="Закрыть">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div id="modal-body">
                <!-- динамически -->
            </div>
        </div>
    </div>

    <!-- BVI панель (выезжающая справа) -->
    <div id="bvi-panel" class="bvi-panel glass" hidden>
        <button class="bvi-close" aria-label="Закрыть панель">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <h3 data-i18n="accessibility">Доступность</h3>
        <div class="bvi-option">
            <span data-i18n="font_size">Размер шрифта</span>
            <div class="bvi-btns">
                <button class="bvi-font-dec" data-i18n="decrease">-</button>
                <span class="bvi-font-value">100%</span>
                <button class="bvi-font-inc" data-i18n="increase">+</button>
            </div>
        </div>
        <div class="bvi-option">
            <span data-i18n="interface_size">Масштаб интерфейса</span>
            <div class="bvi-btns">
                <button class="bvi-scale-dec" data-i18n="small">S</button>
                <span class="bvi-scale-value">100%</span>
                <button class="bvi-scale-inc" data-i18n="large">L</button>
            </div>
        </div>
        <div class="bvi-option">
            <span data-i18n="serif">Шрифт с засечками</span>
            <button class="bvi-serif-toggle" data-i18n="off">Выкл</button>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
